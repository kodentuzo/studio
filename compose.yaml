# Development only: what Studio needs next to it. `pnpm dev` starts this.
name: studio

services:
  postgres:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  registry:
    image: registry:3.1.2
    environment:
      OTEL_TRACES_EXPORTER: none # no tracing; without this it logs export errors
    ports:
      - 127.0.0.1:5001:5000 # 5001 on the host: macOS keeps 5000 for AirPlay
    volumes:
      - registry:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Files go to an S3-style bucket. In development this is RustFS; anywhere else it is whatever
  # bucket Studio is given.
  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: studio
      RUSTFS_SECRET_KEY: studio-dev-secret
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Optional: a small local model for reading invoices. Not started by `pnpm dev`.
  # Start it with: docker compose --profile ai up --detach --wait
  ollama:
    image: ollama/ollama:0.40.17
    profiles: [ai]
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - ollama:/root/.ollama # the downloaded models, a few gigabytes
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres:
  registry:
  storage:
  ollama:
